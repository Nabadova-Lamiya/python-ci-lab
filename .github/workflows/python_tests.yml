name: Python Unit Tests

# Workflow hər dəfə main qoluna Pull Request açılanda tetiklenecek
on:
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest # GitHub-ın bizə verdiyi pulsuz Linux serveri

    steps:
    # 1. Addım: Kodları GitHub-dan bu serverin içinə çəkirik
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. Addım: Serverdə Python mühitini qururuq
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Addım: Testləri qaçırmaq üçün bizə lazım olan pytest alətini yükləyirik
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    # 4. Addım: Unit testləri işə salırıq
    - name: Run unit tests with pytest
      run: |
        pytest
